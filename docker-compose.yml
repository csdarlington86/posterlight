# Start with:  docker compose up -d
# Then read the setup code with:  docker compose logs posterlight
# and open http://<this computer's address>:8686/setup
services:
  posterlight:
    build: .
    container_name: posterlight
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - posterlight-data:/data

volumes:
  posterlight-data:
